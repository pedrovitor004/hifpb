<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/69c80.png" />
    <meta name="theme-color" content="#064e3b" />
    <meta
      name="description"
      content="Consulte horários acadêmicos, salas, professores e avisos do HIFPB."
    />
    <title>HIFPB — Horários acadêmicos</title>
    <script>
      try {
        if (
          localStorage.getItem("hifpb-theme") === "dark" ||
          (!localStorage.getItem("hifpb-theme") &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        )
          document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
